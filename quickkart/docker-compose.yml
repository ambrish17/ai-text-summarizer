version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickkart
      POSTGRES_USER: quickkart
      POSTGRES_PASSWORD: quickkart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: ./entrypoint.sh
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=quickkart
      - DATABASE_USER=quickkart
      - DATABASE_PASSWORD=quickkart
      - DATABASE_PORT=5432
      - DJANGO_SECRET_KEY=replace-me
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/usr/src/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/

volumes:
  postgres_data:
